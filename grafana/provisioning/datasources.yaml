apiVersion: 1

datasources:
  - name: InfluxDB
    type: influxdb
    uid: InfluxDB
    access: proxy
    url: http://influxdb-server:8086
    jsonData:
      version: Flux
      organization: it.uniroma2
      defaultBucket: query_results
    secureJsonData:
      token: ${INFLUX_TOKEN} 
    isDefault: true

  - name: Redis
    type: redis-datasource
    uid: Redis
    access: proxy
    url: redis://redis-server:6379
    isDefault: false